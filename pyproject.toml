[project]
name = "urban-cybernetics"
version = "1.0.0"
description = "Research framework for cybernetic urban mobility systems"
requires-python = ">=3.13"
license = "MPL-2.0"
license-files = ["LICENSE"]
dependencies = [
    "networkx>=3.0",
    "numpy>=2.0",
]

[project.optional-dependencies]
publication = [
    "pillow>=10.1",
]
benchmarks = [
    "networkx>=3.0",
    "numpy>=2.0",
]
geo = [
    "folium>=0.17",
    "geopandas>=1.0",
    "osmnx>=2.0",
    "pandas>=2.2",
    "pyproj>=3.6",
    "scipy>=1.14",
    "shapely>=2.0",
]
dev = [
    "httpx>=0.27",
    "pytest>=8.0",
]
visualisation = [
    "fastapi>=0.115",
    "pydantic>=2.9",
    "uvicorn[standard]>=0.30",
]

[project.scripts]
uc-visualisation = "urban_cybernetics.visualisation.cli:main"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
[tool.setuptools.packages.find]
where = ["src"]
